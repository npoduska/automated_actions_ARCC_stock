name: daily-report
on:
  schedule:
    - cron: '0 10 * * 1-6' # Run every day at 10am, monday-saturday
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with: 
          python-version: '3.x'
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Create requirements.txt
        run: |
          echo "requests==2.31.0" > .github/workflows/requirements.txt
          echo "python-dateutil==2.8.2" >> .github/workflows/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements.txt
      
      - name: Run ARCC stock check code
        id: stock-check
        env:
          API_KEY: ${{secrets.API_KEY}}
          NEWS_API_KEY: ${{secrets.NEWS_API_KEY}}
        run: python .github/workflows/Stock_email_test_email.py
      
      - name: Create GitHub Issue for Stock Alert
        if: steps.stock-check.outputs.alert_triggered == 'true'
        id: create-issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date '+%Y-%m-%d')
          REPO="${GITHUB_REPOSITORY}"
          TITLE="Stock Alert: ARCC - ${TODAY}"
          
          # Create a temporary file with the exact content for the issue body
          echo "${{ steps.stock-check.outputs.alert_message }}" > issue_body.txt
          
          # Create the issue using gh CLI (simpler and more reliable than curl)
          ISSUE_URL=$(gh issue create \
            --title "${TITLE}" \
            --body-file issue_body.txt \
            --label "stock-alert,automated" \
            --repo "${REPO}")
          
          ISSUE_NUMBER=$(echo $ISSUE_URL | rev | cut -d'/' -f1 | rev)
          
          echo "issue_number=${ISSUE_NUMBER}" >> $GITHUB_OUTPUT
          echo "issue_url=${ISSUE_URL}" >> $GITHUB_OUTPUT
          
          echo "Created GitHub issue #${ISSUE_NUMBER} for stock alert"
          echo "Issue URL: ${ISSUE_URL}"
      
      - name: Create alert file
        if: steps.stock-check.outputs.alert_triggered == 'true'
        run: |
          TODAY=$(date '+%Y-%m-%d')
          echo "# Stock Alert: ARCC - ${TODAY}" > stock_alert.md
          echo "" >> stock_alert.md
          echo "${{ steps.stock-check.outputs.alert_message }}" >> stock_alert.md
          
          # Add issue link to the alert file
          if [ -n "${{ steps.create-issue.outputs.issue_url }}" ]; then
            echo "" >> stock_alert.md
            echo "View this issue on GitHub: [${{ steps.create-issue.outputs.issue_number }}](${{ steps.create-issue.outputs.issue_url }})" >> stock_alert.md
          fi
      
      - name: Create alert summary
        if: steps.stock-check.outputs.alert_triggered == 'true'
        run: |
          echo "## Stock Alert triggered on $(date '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.stock-check.outputs.alert_message }}" >> $GITHUB_STEP_SUMMARY
          
          # Add issue link to the summary
          if [ -n "${{ steps.create-issue.outputs.issue_url }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "GitHub Issue: [${{ steps.create-issue.outputs.issue_number }}](${{ steps.create-issue.outputs.issue_url }})" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload alert file
        if: steps.stock-check.outputs.alert_triggered == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stock-alert-${{ github.run_id }}
          path: stock_alert.md
          retention-days: 90
      
      - name: Upload log file
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: script-log
          path: .github/workflows/script.log
