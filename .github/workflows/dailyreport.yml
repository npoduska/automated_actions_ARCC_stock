name: daily-report

on:
   schedule:
     - cron: '0 10  * * 1-6' # Run every day at 10am, monday-saturday
   workflow_dispatch:
#The following is just a very basic version of running A Github Action
# jobs:
#   my-jobs:
#     runs-on: ubuntu-latest
#     steps:
#       - name: first-step
#         run: echo "hi there world!"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with: 
          python-version: '3.x'
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Create requirements.txt
        run: |
          echo "requests==2.31.0" > .github/workflows/requirements.txt
          echo "python-dateutil==2.8.2" >> .github/workflows/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements.txt
      - name: Run ARCC stock check code
        env:
           API_KEY: ${{secrets.API_KEY}}
           NEWS_API_KEY: ${{secrets.NEWS_API_KEY}}
           APP_EMAIL_PASSWORD: ${{secrets.APP_EMAIL_PASSWORD}}
           TO_EMAIL: ${{secrets.TO_EMAIL}}
           MY_EMAIL: ${{secrets.MY_EMAIL}}
        run: python .github/workflows/Stock_email_test_email.py
      - name: Send stock alert email
        if: steps.stock-check.outputs.send_alert == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com  # Or your preferred SMTP server
          server_port: 587
          username: ${{ secrets.MY_EMAIL }}
          password: ${{ secrets.APP_EMAIL_PASSWORD }}
          subject: "Stock Alert: ARCC Price Update"
          body: file:.github/workflows/email_content.txt
          to: ${{ secrets.TO_EMAIL }}
          from: Stock Alert System
      - name: Upload log file
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: script-log
          path: .github/workflows/script.log
