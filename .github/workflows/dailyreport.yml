name: daily-report
on:
  schedule:
    - cron: '0 16 * * 1-5'  # Runs at 4 PM UTC every weekday (adjust as needed)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with: 
          python-version: '3.x'
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Create requirements.txt
        run: |
          echo "requests==2.31.0" > .github/workflows/requirements.txt
          echo "python-dateutil==2.8.2" >> .github/workflows/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements.txt
      
      - name: Run ARCC stock check code
        id: stock-check
        env:
          API_KEY: ${{secrets.API_KEY}}
          NEWS_API_KEY: ${{secrets.NEWS_API_KEY}}
        run: python .github/workflows/Stock_email_test_email.py
      
      - name: Create GitHub Issue for Stock Alert
        if: steps.stock-check.outputs.alert_triggered == 'true'
        uses: actions/github-script@v6
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const alertMessage = `${{ steps.stock-check.outputs.alert_message }}`;
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Stock Alert: ARCC - ${today}`,
              body: alertMessage,
              labels: ['stock-alert', 'automated']
            });
            console.log('Created GitHub issue for stock alert');
      
      - name: Send alert notification
        if: steps.stock-check.outputs.alert_triggered == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MY_EMAIL }}
          password: ${{ secrets.APP_EMAIL_PASSWORD }}
          subject: "Stock Alert: ARCC Price Update"
          body: ${{ steps.stock-check.outputs.alert_message }}
          to: ${{ secrets.TO_EMAIL }}
          from: Stock Alert System
      
      - name: Upload log file
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: script-log
          path: .github/workflows/script.log
