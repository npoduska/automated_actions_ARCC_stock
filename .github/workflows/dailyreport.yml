name: daily-report
on:
  schedule:
    - cron: '0 10 * * 1-6' # Run every day at 10am, monday-saturday
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with: 
          python-version: '3.x'
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Create requirements.txt
        run: |
          echo "requests==2.31.0" > .github/workflows/requirements.txt
          echo "python-dateutil==2.8.2" >> .github/workflows/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements.txt
      
      - name: Run ARCC stock check code
        id: stock-check
        env:
          API_KEY: ${{secrets.API_KEY}}
          NEWS_API_KEY: ${{secrets.NEWS_API_KEY}}
        run: python .github/workflows/Stock_email_test_email.py
      
      - name: Create GitHub Issue for Stock Alert
        if: steps.stock-check.outputs.alert_triggered == 'true'
        run: |
          TODAY=$(date '+%Y-%m-%d')
          REPO="${GITHUB_REPOSITORY}"
          TITLE="Stock Alert: ARCC - ${TODAY}"
          
          # Escape newlines and quotes in alert message for JSON
          ESCAPED_BODY=$(echo '${{ steps.stock-check.outputs.alert_message }}' | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          
          # Create JSON payload for the API request
          JSON_PAYLOAD="{\"title\":\"${TITLE}\",\"body\":\"${ESCAPED_BODY}\",\"labels\":[\"stock-alert\",\"automated\"]}"
          
          # Create the issue using curl
          curl -X POST \
            -H "Authorization: token ${{ secrets.REPO_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${REPO}/issues \
            -d "${JSON_PAYLOAD}"
          
          echo "Created GitHub issue for stock alert"
      
      - name: Create alert file
        if: steps.stock-check.outputs.alert_triggered == 'true'
        run: |
          TODAY=$(date '+%Y-%m-%d')
          echo "# Stock Alert: ARCC - ${TODAY}" > stock_alert.md
          echo "" >> stock_alert.md
          echo "${{ steps.stock-check.outputs.alert_message }}" >> stock_alert.md
      
      - name: Create alert summary
        if: steps.stock-check.outputs.alert_triggered == 'true'
        run: |
          echo "## Stock Alert triggered on $(date '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.stock-check.outputs.alert_message }}" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload alert file
        if: steps.stock-check.outputs.alert_triggered == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stock-alert-${{ github.run_id }}
          path: stock_alert.md
          retention-days: 90
      
      - name: Upload log file
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: script-log
          path: .github/workflows/script.log
